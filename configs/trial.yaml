name: trial
seed: 0

# Mirrors configs/base.yaml exactly, except for a streamed data sample and a short step
# budget — so measured tokens/sec extrapolates directly to a full base run.
model:
  d_model: 768
  num_heads: 12
  num_kv_heads: 4
  d_h: 64
  max_length: 512
  d_ff: 1024
  num_experts: 4
  top_k: 2
  num_layers: 12
  dropout: 0.0

train:
  pretrain:
    effective_batch_token_size: 131072
    minibatch_token_size: 2048
    learning_rate: 8.0e-4
    adam_betas: [0.9, 0.95]
    adam_eps: 1.0e-8
    num_steps: 12
    label_smoothing: 0.0
    router_aux_loss_coef: 0.01
    device: cuda
    checkpoint_steps: 6
    warm_up_steps: 2000
    validation_steps: 6
    validation_batches: 1
    compile_model: true
    num_workers: 4
    prefetch_factor: 2
    cache_clear_steps: 100

data:
  pretrain:
    name: starcoder
    sample_size: 4000
    test_split_ratio: 0.01

tokenizer:
  vocab_size: 32000
  training_size: 2000

locations:
  data_dir: ./data
  models_dir: ./models
