name: test
seed: 0

model:
  d_model: 256
  num_heads: 4
  num_kv_heads: 2    # GQA: groups of 2 query heads share a K/V head
  d_h: 64
  max_length: 256    # Not smaller: a traced easy-tier synth task runs 93-177 tokens, so a
                     # 64-token context drops every SFT row and the stage cannot be smoke
                     # tested at all. Still tiny next to the 1024 the base configs use.
  d_ff: 1024
  num_experts: 4     # total experts per MoE layer
  top_k: 2           # experts active per token (Mixtral-style)
  capacity_factor: 1.25  # rows each expert reserves, as a multiple of its balanced share
                         # (n * top_k / num_experts). The padding is computed and discarded,
                         # so this is ~25% wasted FFN FLOPs bought against router imbalance;
                         # tighten toward 1.1 once the realised max load is known.
  num_layers: 2
  dropout: 0.0

train:
  pretrain:
    effective_batch_token_size: 16384
    minibatch_token_size: 8192     # -> 2 accumulation steps
    learning_rate: 1.0e-4
    adam_betas: [0.9, 0.95]
    adam_eps: 1.0e-8
    num_steps: 200
    label_smoothing: 0.0
    router_aux_loss_coef: 0.01     # weight on the MoE load-balancing loss (Switch Transformer default)
    device: cuda
    checkpoint_steps: 100
    keep_checkpoints: 2
    warm_up_steps: 5
    validation_steps: 20
    validation_batches: 1
    compile_model: true
    num_workers: 4
    prefetch_factor: 2
    cache_clear_steps: 50

  sft:
    effective_batch_token_size: 16384
    minibatch_token_size: 8192
    learning_rate: 2.0e-5           # an order under pretrain: the weights are already good
    adam_betas: [0.9, 0.95]
    adam_eps: 1.0e-8
    num_steps: 100
    label_smoothing: 0.0
    router_aux_loss_coef: 0.01
    device: cuda
    checkpoint_steps: 50
    keep_checkpoints: 2
    warm_up_steps: 5
    validation_steps: 20
    validation_batches: 1
    compile_model: true
    num_workers: 4
    prefetch_factor: 2
    init_from_step: 100             # which pretrain checkpoint seeds this stage. Pin it
                                    # rather than leaving it unset: init_run snapshots this
                                    # config beside the checkpoints, so a pinned step makes
                                    # the snapshot an honest record of what the weights came
                                    # from. It is fingerprinted, so repointing it clears the
                                    # sft run, which is right — different ancestor.

  rl:
    minibatch_prompts_size: 4
    effective_prompts_size: 8
    rollouts_per_group: 8
    learning_rate: 1.0e-6           # an order under sft, the same way sft sits under
                                    # pretrain. RL updates on its own samples, so a step
                                    # large enough to shift the policy sharply changes the
                                    # distribution the next rollouts are drawn from and the
                                    # run has no fixed target to recover towards.
    adam_betas: [0.9, 0.95]
    adam_eps: 1.0e-8
    num_steps: 10
    max_new_tokens: 160             # what the longest prompt in a batch leaves of the 256
                                    # context. generate() caps it at the room available
                                    # anyway, but a value over that warns on every step.
    temperature: 1.0                # the model's own distribution. Anything else has to be
                                    # matched exactly when the loss rescores these tokens,
                                    # and 1.0 makes that division a no-op.
    router_aux_loss_coef: 0.01      # the MoE load-balancing term still applies: RL trains
                                    # the same experts, and dropping it lets routing
                                    # collapse over a run.
    device: cuda
    checkpoint_steps: 50
    keep_checkpoints: 2
    warm_up_steps: 2                # not 0: WarmupInverseSquareRootLR takes the else branch
                                    # at step 0 and computes base_lr * 0**0.5, which is a
                                    # zero learning rate for the whole run.
    validation_steps: 20
    validation_batches: 1
    compile_model: false            # generation changes sequence length every decode step,
                                    # which fullgraph=True cannot hold across.
                                    # No num_workers or prefetch_factor: both exist to
                                    # overlap tokenising and tensor building with the GPU,
                                    # and collate_rl_batch does neither — generate() owns
                                    # the tokenising, so the rows travel as plain dicts.
    init_from_step: 100
    



data:
  pretrain:
    num_shards: 1           # 380MB, and it is shard 0, which the base configs need anyway
    sample_size: 2500       # then capped, so the map stays fast while developing. Enough
                            # that 200 steps x 16384 tokens stays inside one epoch — at
                            # 1000 it needed 12800 blocks and had 6579.
    test_split_ratio: 0.1
  sft:
    num_records: 200        # records, before the fan-out over `tasks`
    tier: easy              # max_depth 0: straight-line code, the tier a small model can do
    tasks: [output]         # synth task formatters to emit: output and/or input prediction
    inputs_per_fn: 4        # sampled inputs per generated function
    with_trace: true        # executed-line trace in the completion, as chain of thought
    test_split_ratio: 0.1
  rl:
    num_records: 200
    tier: easy
    tasks: [output]
    inputs_per_fn: 4
    test_split_ratio: 0.1

tokenizer:
  vocab_size: 16000
  training_size: 1000
  digit_split: true      # every digit its own token, so arithmetic is
                         # compositional. Without it BPE merges numbers into
                         # atomic ids and each fact must be memorised per value.

locations:
  data_dir: ./data
  models_dir: ./models
